services:
  - type: web
    name: teacher-support-studio
    runtime: python               # Kept correct runtime key
    plan: starter
    rootDir: deployment/render
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: uvicorn teacher_support_studio.main:app --app-dir src --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:                      # Fixed indentation below
      - key: PYTHON_VERSION
        value: 3.13.14
